[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "aps-video"
version = "0.1.0"
description = "Adaptive partitioning-based frame selection for long video understanding"
readme = "README.md"
license-files = ["third_party/*.txt", "third_party/NOTICE.md"]
requires-python = ">=3.10"
dependencies = ["numpy>=1.24,<3"]

[project.urls]
Repository = "https://github.com/Baibaione/APS"

[project.optional-dependencies]
test = ["pytest>=8", "ruff>=0.9", "build>=1.2"]
download = ["modelscope", "huggingface-hub"]

[project.scripts]
aps-select = "aps.select:main"
aps-score = "aps.score:main"
aps-infer = "aps.infer:main"
aps-experiments = "aps.experiments:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]
